services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prompt-optimizer:latest
    container_name: prompt-optimizer
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  sqlite_data:
    driver: local
